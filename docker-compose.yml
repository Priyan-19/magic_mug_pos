name: magicmug

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: magic_mug_db
    restart: always
    environment:
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: super_secure_pos_password
      POSTGRES_DB: magic_mug_pos
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - magicmug_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_user -d magic_mug_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: magic_mug_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql+asyncpg://pos_user:super_secure_pos_password@db:5432/magic_mug_pos
      - SECRET_KEY=magic-mug-super-secret-key-change-in-production-2026
      - ALLOWED_ORIGINS=*
    depends_on:
      db:
        condition: service_healthy

  # 3. React Frontend Web Application (Nginx SPA + API Proxy)
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: magic_mug_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  magicmug_pgdata:
