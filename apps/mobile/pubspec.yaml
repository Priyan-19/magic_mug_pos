name: magic_mug_mobile
description: "Magic Mug Cafe POS & Sales Management Mobile Application for Android & iOS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.2

  # Networking & Auth
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3

  # UI, Fonts & Icons
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1

  # Analytics & Charts
  fl_chart: ^0.68.0

  # Printing & Sharing
  screenshot: ^3.0.0
  share_plus: ^13.3.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon_ios_legacy.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/hd_badge_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/logo.png
    - assets/master_icon_transparent.png

