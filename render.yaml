services:
  # Magic Mug FastAPI Backend Service
  - type: web
    name: magic-mug-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        value: postgresql://postgres.xkhvbvzgxhccxvpjywzc:magicmugdb2026@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: ENV
        value: "production"
      - key: DEBUG
        value: "false"
