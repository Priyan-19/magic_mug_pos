services:
  # Magic Mug FastAPI Backend Service
  - type: web
    name: magic-mug-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: magic-mug-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: ENV
        value: "production"
      - key: DEBUG
        value: "false"

databases:
  # Managed PostgreSQL Database for Magic Mug POS
  - name: magic-mug-db
    databaseName: magic_mug_pos
    user: pos_user
    plan: free
