services:
  # Magic Mug FastAPI Backend Service
  - type: web
    name: magic-mug-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://magic-mug-pos.vercel.app,https://magic-mug-pos.onrender.com,http://localhost:5173"
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: ENV
        value: "production"
      - key: DEBUG
        value: "false"
